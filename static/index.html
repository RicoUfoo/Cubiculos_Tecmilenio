<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserva de Cubículos</title>
  <style>
    :root {
      --deep: #07301F;
      --on-deep: #EAF6EF;
      --on-deep-muted: #A5CDB7;
      --accent: #86E3AE;
      --bg: #EDF3EF;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: #0E2218;
    }
    .hero {
      background: var(--deep);
      color: var(--on-deep);
      padding: 40px 20px;
    }
    .wrap { max-width: 1000px; margin: 0 auto; }
    .top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 24px;
    }
    .eyebrow {
      margin: 0 0 6px;
      font-size: 13px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--on-deep-muted);
    }
    h1 { margin: 0; font-size: clamp(2.2rem, 7vw, 3.4rem); line-height: 1; }
    .lede { margin: 12px 0 0; max-width: 480px; font-size: 18px; }
    .beneficios {
      list-style: none;
      margin: 16px 0 0;
      padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 16px;
      font-size: 14px;
    }
    .beneficios li::before { content: "✓ "; color: var(--accent); font-weight: 700; }
    .cta {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      border-radius: 10px;
      background: var(--on-deep);
      color: var(--deep);
      font-weight: 600;
      text-decoration: none;
    }
    .cta:hover { background: #fff; }
    .cta:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
    .clock { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .clock-time { font-family: ui-monospace, Menlo, monospace; font-size: 34px; }
    .clock-date { font-size: 13px; color: var(--on-deep-muted); }
    .contenido { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  </style>
</head>
<body>

  <!-- Página principal con propuesta de valor clara -->
  <header class="hero">
    <div class="wrap">
      <div class="top">
        <div>
          <p class="eyebrow">Sala de estudio</p>
          <h1>Cubículos</h1>
          <p class="lede">Mira cuáles están libres, quién los tiene y a qué hora, y aparta el tuyo en un minuto.</p>

          <ul class="beneficios">
            <li>Disponibilidad en tiempo real</li>
            <li>Sin registro ni contraseña</li>
            <li>Hasta 3 personas por cubículo</li>
          </ul>

          <a class="cta" href="#cubiculos">Ver cubículos disponibles</a>
        </div>

        <div class="clock">
          <span class="clock-time" id="clockTime">--:--</span>
          <span class="clock-date" id="clockDate"></span>
        </div>
      </div>
    </div>
  </header>

  <main class="contenido" id="cubiculos">
    <h2>Plano de la sala · 5 cubículos</h2>
    <p>Aquí irá el plano.</p>
  </main>

</body>
</html>
