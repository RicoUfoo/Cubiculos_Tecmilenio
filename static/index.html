<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reserva de Cubículos</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>

  <!-- T2: Página principal con propuesta de valor clara -->
  <header class="hero">
    <div class="wrap">
      <div class="top">
        <div>
          <p class="eyebrow">Sala de estudio</p>
          <h1>Cubículos</h1>
          <p class="lede">Mira cuáles están libres, quién los tiene y a qué hora, y aparta el tuyo en un minuto.</p>

          <ul class="beneficios">
            <li>Disponibilidad en tiempo real</li>
            <li>Sin registro ni contraseña</li>
            <li>Hasta 3 personas por cubículo</li>
          </ul>

          <a class="cta" href="#cubiculos">Ver cubículos disponibles</a>
        </div>

        <div class="clock">
          <span class="clock-time" id="clockTime">--:--</span>
          <span class="clock-date" id="clockDate"></span>
        </div>
      </div>
    </div>
  </header>

  <!-- T3: Plano de los 5 cubículos (se genera desde Script.js) -->
  <main class="contenido" id="cubiculos">
    <h2 id="planoTitulo">Plano de la sala · 5 cubículos</h2>
    <div class="booths" id="plano" aria-labelledby="planoTitulo"></div>
    <div class="door"><span>Entrada</span></div>
  </main>

  <script src="Script.js"></script>
</body>
</html>
